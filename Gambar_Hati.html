<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<title>Untuk Nazwaa ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at center, #1b0715 0%, #08060d 70%);
  overflow: hidden;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: #ff8eaf;
}
#heart { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.name {
  position: absolute;
  color: #ff3978;
  font-weight: bold;
  white-space: nowrap;
  text-shadow: 0 0 7px #ff1744, 0 0 13px #ff3978;
  animation: glow 1.5s ease-in-out infinite alternate;
  user-select: none;
  pointer-events: none;
}
@keyframes glow {
  from { opacity: .35; filter: brightness(.8); }
  to { opacity: 1; filter: brightness(1.5); }
}
#title {
  position: absolute;
  bottom: 7%;
  width: 100%;
  text-align: center;
  color: #ff9fbd;
  font-size: clamp(16px, 4vw, 24px);
  text-shadow: 0 0 10px #ff1744, 0 0 22px #ff3978;
  letter-spacing: 3px;
  animation: pulse 1.8s ease-in-out infinite alternate;
}
@keyframes pulse { to { transform: scale(1.06); } }
#hint {
  position: absolute;
  top: 4%;
  width: 100%;
  text-align: center;
  color: #f7b8cc;
  opacity: .75;
  font-size: 12px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div id="heart" aria-label="Nama Nazwaa membentuk hati"></div>
<div id="hint">SEBUAH HATI UNTUKMU</div>
<div id="title">NAZWAA ❤️</div>
<script>
const nama = "Nazwaa";
const heart = document.getElementById("heart");

function tambahNama(x, y, ukuran = 11) {
  const teks = document.createElement("span");
  teks.className = "name";
  teks.textContent = nama;
  teks.style.left = x + "px";
  teks.style.top = y + "px";
  teks.style.fontSize = ukuran + "px";
  teks.style.transform = "translate(-50%, -50%)";
  teks.style.animationDelay = (Math.random() * 1.8) + "s";
  heart.appendChild(teks);
}

function buatHati() {
  heart.innerHTML = "";
  const w = window.innerWidth;
  const h = window.innerHeight;
  const scale = Math.min(w / 37, h / 36);
  const cx = w / 2;
  const cy = h * 0.44;

  // Garis luar hati
  for (let t = 0; t < Math.PI * 2; t += 0.045) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t) - Math.cos(4*t);
    tambahNama(cx + x * scale, cy - y * scale, 10);
  }

  // Isian hati dengan posisi acak yang tetap berada di dalam bentuk hati
  let jumlah = 0;
  let percobaan = 0;
  while (jumlah < 360 && percobaan < 5000) {
    percobaan++;
    const x = (Math.random() * 2 - 1) * 15.5;
    const y = (Math.random() * 2 - 1) * 13;
    const a = x / 16;
    const b = y / 13;
    const rumus = Math.pow(a*a + b*b - 1, 3) - a*a*Math.pow(b, 3);
    if (rumus <= 0) {
      tambahNama(cx + x * scale, cy - y * scale, 8 + Math.random() * 3);
      jumlah++;
    }
  }
}

buatHati();
window.addEventListener("resize", buatHati);
</script>
</body>
</html>
